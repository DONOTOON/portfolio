<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김재석 이력서</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --ink: #16161a; --body: #2a2a2e; --muted: #7a7a80; --line: #e3e3e0; --accent: #1f3fe0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @page { size: A4; margin: 16mm 17mm; }
    html { background: #ececea; }
    body { font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; color: var(--body); font-size: 9.6pt; line-height: 1.75; word-break: keep-all; }
    .page { max-width: 210mm; margin: 24px auto; background: #fff; padding: 16mm 17mm; }
    @media print { html { background: #fff; } .page { margin: 0; padding: 0; max-width: none; } .no-print { display: none !important; } }
    a { color: inherit; text-decoration: none; }

    .bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 16px; padding: 10px 16px; background: #111114; color: #fff; font-size: 14px; }
    .bar a { text-decoration: underline; text-underline-offset: 3px; }
    .bar a.on { text-decoration: none; font-weight: 700; color: #9fb0ff; }

    header { display: flex; gap: 22pt; align-items: center; padding-bottom: 16pt; border-bottom: 1px solid var(--line); }
    .photo { width: 76pt; height: 94pt; border-radius: 6pt; overflow: hidden; background: #e6e6e2; flex: none; }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 21pt; font-weight: 800; color: var(--ink); letter-spacing: -.02em; line-height: 1.2; }
    .role { margin-top: 4pt; font-size: 12pt; font-weight: 700; color: var(--accent); }
    .contact { margin-top: 8pt; font-size: 8.4pt; color: var(--muted); line-height: 1.7; }

    .headline { margin-top: 18pt; font-size: 14pt; font-weight: 800; color: var(--ink); letter-spacing: -.02em; }
    .intro { margin-top: 8pt; }
    .sec-q { margin-top: 20pt; break-inside: avoid-page; }
    .sec-q h3 { font-size: 11.6pt; font-weight: 800; color: var(--ink); margin-bottom: 6pt; }
    .sec-q p + p { margin-top: 2pt; }

    h2 { margin-top: 24pt; font-size: 15pt; font-weight: 800; color: var(--ink); padding-bottom: 7pt; border-bottom: 1px solid var(--line); break-after: avoid; }
    .co { margin-top: 11pt; break-inside: avoid; }
    .co h4 { font-size: 11.6pt; font-weight: 800; color: var(--ink); }
    .meta { font-size: 8.4pt; color: var(--muted); padding-bottom: 6pt; border-bottom: 1px solid var(--line); margin-bottom: 6pt; }
    .grp { margin-top: 6pt; }
    .grp b { display: block; font-size: 9.6pt; color: var(--ink); }
    ul { list-style: none; }
    li::before { content: "· "; }
    .edu { margin-top: 12pt; break-inside: avoid; }
    .edu h4 { font-size: 11pt; font-weight: 800; color: var(--ink); }
    .edu h4 span { font-weight: 600; font-size: 9.6pt; }
    .edu .meta { border: 0; padding: 0; margin: 2pt 0 0; }
    .kv { display: grid; grid-template-columns: 52mm 1fr; gap: 0 10pt; padding: 5pt 0; border-bottom: 1px solid var(--line); }
    .kv b { color: var(--ink); font-weight: 700; }
    .keep { break-inside: avoid; }
    .first-h2 { margin-top: 34pt; }
    @media print { .break { break-before: page; margin-top: 0; } }
    @media (max-width: 640px) {
      .page { padding: 20px 16px; margin: 0; }
      header { gap: 14px; }
      .photo { width: 64px; height: 80px; }
      .kv { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bar no-print" id="bar"></div>
  <div class="page" id="r"></div>
  <script src="js/resume-data.js"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const vKey = RESUME_VERSIONS[qs.get("v")] ? qs.get("v") : "chat";
    const V = RESUME_VERSIONS[vKey];
    const C = RESUME_COMMON;
    document.title = `김재석 이력서 — ${V.role}`;

    document.getElementById("bar").innerHTML =
      Object.entries(RESUME_VERSIONS).map(([k, v]) => `<a class="${k === vKey ? "on" : ""}" href="?v=${k}">${v.role}</a>`).join("") +
      `<span>·</span><a href="${V.file}" download="${V.download}">PDF 다운로드</a><a href="index.html">포트폴리오로</a>`;

    const ul = (items) => `<ul>${items.map((t) => `<li>${t}</li>`).join("")}</ul>`;
    const block = ([t, meta, items]) => `<div class="co"><h4>${t}</h4><p class="meta">${meta}</p>${ul(items)}</div>`;

    document.getElementById("r").innerHTML = `
      <header>
        <div class="photo"><img src="${C.photo}" alt=""></div>
        <div>
          <h1>${C.name}</h1>
          <p class="role">${V.role}</p>
          <p class="contact">${C.email}<br>${C.site}</p>
        </div>
      </header>

      <p class="headline">${C.headline}</p>
      <div class="intro">${[...C.introBase, V.introLast].map((t) => `<p>${t}</p>`).join("")}</div>

      ${V.sections.map(([h, ps]) => `<section class="sec-q"><h3>[${h}]</h3>${ps.map((p) => `<p>${p}</p>`).join("")}</section>`).join("")}

      <h2 class="break first-h2">주요경력</h2>
      ${C.career.map((c) => `<div class="co"><h4>${c.co}</h4><p class="meta">${c.meta}</p>
        ${c.groups.map(([g, items]) => `<div class="grp"><b>${g}</b>${ul(items)}</div>`).join("")}</div>`).join("")}

      <h2>기타 경력 &amp; 개인 프로젝트</h2>
      ${C.etc.map(block).join("")}
      ${V.projects.map((id) => block(C.projects[id])).join("")}

      <section class="keep">
      <h2>학력</h2>
      ${C.education.map(([s, m, d]) => `<div class="edu"><h4>${s} <span>/ ${m}</span></h4><p class="meta">${d}</p></div>`).join("")}
      </section>

      <section class="keep">
      <h2>스킬</h2>
      ${C.skills.map(([k, v]) => `<div class="kv"><b>${k}</b><span>${v}</span></div>`).join("")}
      </section>

      <h2>교육</h2>
      ${C.courses.map(block).join("")}

      <section class="keep">
      <h2>언어</h2>
      ${C.languages.map(([k, v]) => `<div class="kv"><b>${k}</b><span>${v}</span></div>`).join("")}
      </section>
    `;
  </script>
</body>
</html>
