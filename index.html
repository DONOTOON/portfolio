<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김재석 포트폴리오</title>
  <meta name="description" content="김재석 — 콘텐츠 디자이너 · 캐릭터챗 PD · 웹툰 PD 포트폴리오">
  <meta property="og:title" content="김재석 포트폴리오">
  <meta property="og:description" content="세 가지 언어로, 하나의 경험을 설계합니다.">
  <meta property="og:image" content="https://donotoon.github.io/portfolio/assets/covers/wol.jpg">
  <meta property="og:url" content="https://donotoon.github.io/portfolio/">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="#" data-keep-track>KIM JAESEOK<span>.</span></a>
      <nav class="nav">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <div class="hero-meta">
          <span class="eyebrow">Portfolio 2026</span>
          <span class="role" id="role"></span>
        </div>
        <h1 id="tagline"></h1>
        <p class="statement" id="statement" hidden></p>
        <div class="langs" id="langs"></div>
        <p class="hero-intro" id="intro"></p>
      </div>
    </section>

    <div class="wrap">
      <div class="highlights" id="highlights"></div>
    </div>

    <section class="sec" id="work">
      <div class="wrap">
        <div class="sec-head">
          <h2 class="sec-title">Work<sup id="count"></sup></h2>
          <div class="filters" id="filters"></div>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <section class="sec about" id="about">
      <div class="wrap about-grid">
        <div>
          <div class="avatar"><img src="assets/avatar.jpg" alt="김재석 캐릭터 일러스트"></div>
          <p class="about-name"><small>KIM JAESEOK</small>김재석</p>
        </div>
        <div>
          <div class="block"><h3>Career</h3><div id="career"></div></div>
          <div class="block"><h3>Education</h3><div id="edu"></div></div>
          <div class="block"><h3>Courses</h3><div id="courses"></div></div>
          <div class="block"><h3>Skills</h3><div id="skills"></div></div>
          <div class="block"><h3>Language</h3><div id="lang"></div></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="contact" id="contact">
    <div class="wrap">
      <p class="eyebrow">Contact</p>
      <a class="big" id="mail"></a><br>
      <button class="copy" id="copy" type="button">이메일 복사</button>
      <div class="foot"><span>© 2026 Kim Jaeseok</span><span>세 가지 언어로, 하나의 경험을 설계합니다.</span></div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
